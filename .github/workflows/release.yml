name: Release

# Push a tag such as v0.1.0. The zip is built from the tag, checked, installed in a
# real store and tested, and only then attached to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
      - name: Tag, plugin header and readme agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx " \* Version: $version" ng-postcode-for-woocommerce.php
          grep -qx "Stable tag: $version" readme.txt
      - run: composer install --no-progress
      - run: composer test
      - run: sh tests/plugin-check/run.sh
      - name: The zip itself works inside WooCommerce
        run: |
          unzip -q ng-postcode-for-woocommerce.zip -d "$RUNNER_TEMP"
          PLUGIN_DIR="$RUNNER_TEMP/ng-postcode-for-woocommerce" sh tests/integration/run.sh
      - run: gh release create "$GITHUB_REF_NAME" ng-postcode-for-woocommerce.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

name: Spec drift

# Fails when ng-postcode's spec has moved past the copy here. To catch up, run
# scripts/spec_sync.sh main --write and fix whatever the new cases break.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/spec_sync.sh main
